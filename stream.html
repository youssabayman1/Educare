  <style>
    body {
      font-family: "Inter", sans-serif;
    }
      /* Floating larger AI companion */
      @keyframes float {
            0% {
                transform: translatey(0px);
            }
            50% {
                transform: translatey(-10px);
            }
            100% {
                transform: translatey(0px);
            }
        }
        .floating {
            animation: float 2s ease-in-out infinite;
        }

        .fade-in {
            animation: fadeIn 6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .slide-in {
            animation: slideIn 1s ease-in-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(0);
            }
        }
    #postsContainer {
      max-height: 400px;
      overflow-y: auto;
    }
    #calendarPage {
      display: none;
    }
    #calendarGrid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #e2e8f0;
      border-radius: 0.75rem;
      overflow: hidden;
    }
    #calendarGrid > div {
      background: white;
      min-height: 80px;
      padding: 0.25rem;
      font-size: 0.75rem;
      position: relative;
    }
    #calendarGrid > div span.date-number {
      font-weight: 600;
      font-size: 0.8rem;
      color: #475569;
    }
    #calendarGrid > div div.event {
      background-color: #0284c7;
      color: white;
      font-size: 0.65rem;
      padding: 0.1rem 0.3rem;
      border-radius: 0.375rem;
      margin-top: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
    }
    #calendarGrid > div div.event:hover {
      background-color: #0369a1;
    }
    /* Scrollbar for posts container */
    #postsContainer::-webkit-scrollbar {
      width: 8px;
    }
    #postsContainer::-webkit-scrollbar-thumb {
      background-color: rgba(0,0,0,0.1);
      border-radius: 4px;
    }
    /* File icon styles */
    .file-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      margin-right: 0.5rem;
    }
    .file-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #0284c7;
      text-decoration: underline;
      cursor: pointer;
    }
    /* Tooltip style */
    .tooltip {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }
    .tooltip .tooltiptext {
      visibility: hidden;
      width: 80px;
      background-color: #0284c7;
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 4px 0;
      position: absolute;
      z-index: 10;
      bottom: 125%;
      left: 50%;
      margin-left: -40px;
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 0.75rem;
      user-select: none;
    }
    .tooltip:hover .tooltiptext {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>

  <script>
    // Navigation tabs and pages
    const tabStream = document.getElementById("tabStream");
    const tabClasswork = document.getElementById("tabClasswork");
    const tabCalendar = document.getElementById("tabCalendar");
    const streamPage = document.getElementById("streamPage");
    const calendarPage = document.getElementById("calendarPage");

    // Sidebar nav dashboard (just scroll to top)
    const navDashboard = document.getElementById("navDashboard");
    navDashboard.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Show/hide pages on tab click
    function showPage(page) {
      if (page === "stream") {
        streamPage.style.display = "flex";
        calendarPage.style.display = "none";
        tabStream.classList.add("text-sky-600", "font-semibold");
        tabStream.classList.remove("text-gray-500");
        tabCalendar.classList.remove("text-sky-600", "font-semibold");
        tabCalendar.classList.add("text-gray-500");
      } else if (page === "calendar") {
        streamPage.style.display = "none";
        calendarPage.style.display = "flex";
        tabCalendar.classList.add("text-sky-600", "font-semibold");
        tabCalendar.classList.remove("text-gray-500");
        tabStream.classList.remove("text-sky-600", "font-semibold");
        tabStream.classList.add("text-gray-500");
        renderCalendar();
      }
    }

    tabStream.addEventListener("click", (e) => {
      e.preventDefault();
      showPage("stream");
    });
    tabCalendar.addEventListener("click", (e) => {
      e.preventDefault();
      showPage("calendar");
    });

    // Initially show stream page
    showPage("stream");

    // Posts and events data
    const postsContainer = document.getElementById("postsContainer");
    const postBtn = document.getElementById("postBtn");
    const postText = document.getElementById("postText");
    const imageUpload = document.getElementById("imageUpload");
    const videoUpload = document.getElementById("videoUpload");
    const fileUpload = document.getElementById("fileUpload");
    const previewContainer = document.getElementById("previewContainer");

    // Events data array
    let events = [];

    // Posts data array with comments array
    let posts = [
      {
        id: 1,
        text: "",
        media: [],
        files: [],
        date: new Date("2024-05-17"),
        views: 10,
        comments: [],
      },
      {
        id: 2,
        text:
          "After achieving the target of points each month you will get one free class from me as a gift\nThe Target points each month from 100-400\nwho will be the highest in points will have the gift inshallah\nGood luck!",
        media: [
          {
            url:
              "https://storage.googleapis.com/a1aa/image/c4c58f27-23ce-4331-2caa-c05a87d53360.jpg",
            type: "application/pdf",
            name: "Class Rules.pdf",
          },
        ],
        files: [],
        date: new Date("2024-05-17"),
        views: 10,
        comments: [],
      },
    ];

    // Enable post button only if text or files are present
    function updatePostButtonState() {
      const hasText = postText.value.trim().length > 0;
      const hasFiles =
        imageUpload.files.length > 0 ||
        videoUpload.files.length > 0 ||
        fileUpload.files.length > 0;
      postBtn.disabled = !(hasText || hasFiles);
    }

    postText.addEventListener("input", updatePostButtonState);
    imageUpload.addEventListener("change", () => {
      updatePostButtonState();
      updatePreview();
    });
    videoUpload.addEventListener("change", () => {
      updatePostButtonState();
      updatePreview();
    });
    fileUpload.addEventListener("change", () => {
      updatePostButtonState();
      updatePreview();
    });

    // Clear preview container and show thumbnails/previews of selected files
    function updatePreview() {
      previewContainer.innerHTML = "";
      const files = [
        ...imageUpload.files,
        ...videoUpload.files,
        ...fileUpload.files,
      ];
      files.forEach((file) => {
        const fileType = file.type;
        const fileURL = URL.createObjectURL(file);
        let previewEl;

        if (fileType.startsWith("image/")) {
          previewEl = document.createElement("img");
          previewEl.src = fileURL;
          previewEl.alt = `Uploaded image preview: ${file.name}`;
          previewEl.className =
            "w-20 h-20 object-cover rounded-lg border border-gray-300";
        } else if (fileType.startsWith("video/")) {
          previewEl = document.createElement("video");
          previewEl.src = fileURL;
          previewEl.controls = true;
          previewEl.className =
            "w-28 h-20 object-cover rounded-lg border border-gray-300";
        } else {
          // For files (pdf, doc, ppt), show icon and filename
          previewEl = document.createElement("div");
          previewEl.className =
            "flex items-center gap-2 border border-gray-300 rounded-lg p-2 bg-white text-xs text-gray-700 max-w-xs";
          const icon = document.createElement("i");
          icon.className = "fas fa-file-alt text-sky-600";
          previewEl.appendChild(icon);
          const filename = document.createElement("span");
          filename.textContent = file.name;
          previewEl.appendChild(filename);
        }
        previewContainer.appendChild(previewEl);
      });
    }

    // Format date as "DD MMM YYYY"
    function formatDate(date) {
      const options = { day: "2-digit", month: "short", year: "numeric" };
      return date.toLocaleDateString("en-GB", options);
    }

    // Create a comment element
    function createCommentElement(comment) {
      const commentDiv = document.createElement("div");
      commentDiv.className = "flex items-start gap-2 mt-2";

      const avatar = document.createElement("img");
      avatar.src = comment.avatar;
      avatar.alt = `Avatar of ${comment.name}`;
      avatar.className = "w-6 h-6 rounded-full object-cover mt-1";

      const contentDiv = document.createElement("div");
      contentDiv.className = "bg-gray-100 rounded-xl p-2 text-xs flex-1";

      const nameSpan = document.createElement("span");
      nameSpan.className = "font-semibold text-gray-700";
      nameSpan.textContent = comment.name;

      const textP = document.createElement("p");
      textP.textContent = comment.text;

      contentDiv.appendChild(nameSpan);
      contentDiv.appendChild(textP);

      commentDiv.appendChild(avatar);
      commentDiv.appendChild(contentDiv);

      return commentDiv;
    }

    // Create a post element and append to posts container
    function createPostElement(post) {
      const article = document.createElement("article");
      article.className =
        "bg-white rounded-xl p-4 shadow-sm border border-gray-100";
      article.dataset.postId = post.id;

      // Header with avatar, name, date
      const header = document.createElement("header");
      header.className = "flex items-center justify-between mb-2";

      const userDiv = document.createElement("div");
      userDiv.className = "flex items-center gap-2";

      const avatar = document.createElement("img");
      avatar.src =
        "../assets/Images/AI women.jpg";
      avatar.alt = "User avatar of Sarah othman";
      avatar.className = "rounded-full w-8 h-8 object-cover";
      avatar.height = 32;
      avatar.width = 32;

      const username = document.createElement("span");
      username.className = "font-semibold text-gray-800 text-sm";
      username.textContent = "Sarah othman";

      userDiv.appendChild(avatar);
      userDiv.appendChild(username);

      const time = document.createElement("time");
      time.className = "text-xs text-gray-400";
      time.dateTime = post.date.toISOString().split("T")[0];
      time.textContent = formatDate(post.date);

      header.appendChild(userDiv);
      header.appendChild(time);

      article.appendChild(header);

      // Content text container (for editing)
      const contentContainer = document.createElement("div");
      contentContainer.className = "mb-3";

      const contentP = document.createElement("p");
      contentP.className = "text-xs whitespace-pre-line";
      contentP.textContent = post.text;

      contentContainer.appendChild(contentP);
      article.appendChild(contentContainer);

      // Media container (images/videos)
      if (post.media && post.media.length > 0) {
        const mediaContainer = document.createElement("div");
        mediaContainer.className = "flex flex-wrap gap-3 mb-3";

        post.media.forEach((media) => {
          if (media.type.startsWith("image/")) {
            const img = document.createElement("img");
            img.src = media.url;
            img.alt = `Uploaded image: ${media.name}`;
            img.className =
              "w-28 h-28 object-cover rounded-lg border border-gray-300";
            mediaContainer.appendChild(img);
          } else if (media.type.startsWith("video/")) {
            const video = document.createElement("video");
            video.src = media.url;
            video.controls = true;
            video.className =
              "w-40 h-28 object-cover rounded-lg border border-gray-300";
            mediaContainer.appendChild(video);
          }
        });

        article.appendChild(mediaContainer);
      }

      // Files container (pdf, word, pptx)
      if (post.files && post.files.length > 0) {
        const filesContainer = document.createElement("div");
        filesContainer.className = "flex flex-col gap-2 mb-3";

        post.files.forEach((file) => {
          const fileLink = document.createElement("a");
          fileLink.href = file.url;
          fileLink.target = "_blank";
          fileLink.rel = "noopener noreferrer";
          fileLink.className = "file-link";

          const icon = document.createElement("i");
          icon.className = "fas fa-file-alt text-sky-600";

          const filenameSpan = document.createElement("span");
          filenameSpan.textContent = file.name;

          fileLink.appendChild(icon);
          fileLink.appendChild(filenameSpan);
          filesContainer.appendChild(fileLink);
        });

        article.appendChild(filesContainer);
      }

      // Views count
      const viewsDiv = document.createElement("div");
      viewsDiv.className =
        "flex justify-end text-sky-500 text-xs gap-1 items-center mb-2";
      const eyeIcon = document.createElement("i");
      eyeIcon.className = "far fa-eye";
      viewsDiv.appendChild(eyeIcon);
      const viewsText = document.createElement("span");
      viewsText.textContent = `${post.views} views`;
      viewsDiv.appendChild(viewsText);
      article.appendChild(viewsDiv);

      // Comment button and more options container
      const actionDiv = document.createElement("div");
      actionDiv.className = "flex items-center gap-4";

      // Comment button toggles comment form
      const commentBtn = document.createElement("button");
      commentBtn.className =
        "flex items-center gap-2 text-sky-500 text-xs font-semibold border border-sky-300 rounded-full py-1 px-3 hover:bg-sky-100 transition";
      commentBtn.innerHTML = '<i class="far fa-comment"></i> Comment';
      actionDiv.appendChild(commentBtn);

      // More options (three dots)
      const moreDiv = document.createElement("div");
      moreDiv.className = "relative";

      const moreBtn = document.createElement("button");
      moreBtn.className =
        "text-gray-400 hover:text-gray-600 text-lg px-2 py-1 rounded-full";
      moreBtn.title = "More options";
      moreBtn.setAttribute("aria-label", "More options");
      moreBtn.innerHTML = '<i class="fas fa-ellipsis-h"></i>';
      moreDiv.appendChild(moreBtn);

      // Dropdown menu
      const dropdown = document.createElement("div");
      dropdown.className =
        "absolute right-0 top-full mt-1 w-24 bg-white border border-gray-200 rounded-lg shadow-lg opacity-0 invisible transition-opacity z-10";
      dropdown.style.transition = "opacity 0.2s ease";

      const editBtn = document.createElement("button");
      editBtn.className =
        "block w-full text-left px-4 py-2 text-sm text-sky-600 hover:bg-sky-50";
      editBtn.textContent = "Edit";
      dropdown.appendChild(editBtn);

      const deleteBtn = document.createElement("button");
      deleteBtn.className =
        "block w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50";
      deleteBtn.textContent = "Delete";
      dropdown.appendChild(deleteBtn);

      moreDiv.appendChild(dropdown);
      actionDiv.appendChild(moreDiv);

      article.appendChild(actionDiv);

      // Show/hide dropdown on moreBtn click
      moreBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isVisible = dropdown.classList.contains("opacity-100");
        closeAllDropdowns();
        if (!isVisible) {
          dropdown.classList.remove("opacity-0", "invisible");
          dropdown.classList.add("opacity-100");
        }
      });

      // Close dropdowns on outside click
      function closeAllDropdowns() {
        document.querySelectorAll("div[role='dropdown']").forEach((el) => {
          el.classList.remove("opacity-100");
          el.classList.add("opacity-0", "invisible");
        });
        // Also close our dropdown
        dropdown.classList.remove("opacity-100");
        dropdown.classList.add("opacity-0", "invisible");
      }
      document.addEventListener("click", () => {
        dropdown.classList.remove("opacity-100");
        dropdown.classList.add("opacity-0", "invisible");
      });

      // Mark dropdown for closeAllDropdowns
      dropdown.setAttribute("role", "dropdown");

      // Comment form container (hidden initially)
      const commentFormContainer = document.createElement("div");
      commentFormContainer.className = "mt-3 hidden flex-col gap-2";

      // Comment list container
      const commentList = document.createElement("div");
      commentList.className = "flex flex-col gap-2";

      // Render existing comments
      post.comments.forEach((comment) => {
        const commentEl = createCommentElement(comment);
        commentList.appendChild(commentEl);
      });

      // Comment input form
      const commentForm = document.createElement("form");
      commentForm.className = "flex items-center gap-2";

      const commentInput = document.createElement("input");
      commentInput.type = "text";
      commentInput.placeholder = "Add a comment...";
      commentInput.required = true;
      commentInput.className =
        "flex-1 rounded-full border border-gray-300 px-3 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-sky-400";

      const commentSubmitBtn = document.createElement("button");
      commentSubmitBtn.type = "submit";
      commentSubmitBtn.className =
        "bg-sky-600 text-white rounded-full px-3 py-1 text-xs hover:bg-sky-700 transition";
      commentSubmitBtn.textContent = "Post";

      commentForm.appendChild(commentInput);
      commentForm.appendChild(commentSubmitBtn);

      commentFormContainer.appendChild(commentList);
      commentFormContainer.appendChild(commentForm);

      article.appendChild(commentFormContainer);

      // Toggle comment form visibility on comment button click
      commentBtn.addEventListener("click", () => {
        if (commentFormContainer.classList.contains("hidden")) {
          commentFormContainer.classList.remove("hidden");
          commentInput.focus();
        } else {
          commentFormContainer.classList.add("hidden");
        }
      });

      // Handle comment form submission
      commentForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = commentInput.value.trim();
        if (!text) return;

        // For demo, commenter is Mohamed Bakr with avatar
        const newComment = {
          id: Date.now(),
          name: "Mohamed Bakr",
          avatar:
            "https://storage.googleapis.com/a1aa/image/42d400cf-1a06-489a-6c3c-9d220b14b396.jpg",
          text,
        };

        // Add comment to post data
        post.comments.push(newComment);

        // Add comment element to comment list
        const commentEl = createCommentElement(newComment);
        commentList.appendChild(commentEl);

        // Clear input
        commentInput.value = "";
        commentInput.focus();
      });

      // Edit post functionality
      editBtn.addEventListener("click", () => {
        dropdown.classList.remove("opacity-100");
        dropdown.classList.add("opacity-0", "invisible");

        // Replace contentP with textarea for editing
        const textarea = document.createElement("textarea");
        textarea.className =
          "w-full rounded-md border border-gray-300 p-2 text-xs resize-none focus:outline-none focus:ring-2 focus:ring-sky-400";
        textarea.value = post.text;
        textarea.rows = 4;

        contentContainer.replaceChild(textarea, contentP);

        // Change edit button to Save and add Cancel button
        editBtn.textContent = "Save";
        editBtn.classList.remove("text-sky-600");
        editBtn.classList.add("text-green-600");

        // Disable delete button while editing
        deleteBtn.disabled = true;
        deleteBtn.classList.add("opacity-50", "cursor-not-allowed");

        // Add cancel button if not exists
        let cancelBtn = dropdown.querySelector(".cancel-edit-btn");
        if (!cancelBtn) {
          cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className =
            "cancel-edit-btn block w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50";
          cancelBtn.textContent = "Cancel";
          dropdown.appendChild(cancelBtn);

          cancelBtn.addEventListener("click", () => {
            // Restore original content
            contentContainer.replaceChild(contentP, textarea);
            editBtn.textContent = "Edit";
            editBtn.classList.add("text-sky-600");
            editBtn.classList.remove("text-green-600");
            deleteBtn.disabled = false;
            deleteBtn.classList.remove("opacity-50", "cursor-not-allowed");
            cancelBtn.remove();
          });
        }

        // Save edited content on editBtn click (now Save)
        editBtn.onclick = () => {
          const newText = textarea.value.trim();
          if (newText === "") {
            alert("Post content cannot be empty.");
            textarea.focus();
            return;
          }
          post.text = newText;
          contentP.textContent = newText;
          contentContainer.replaceChild(contentP, textarea);
          editBtn.textContent = "Edit";
          editBtn.classList.add("text-sky-600");
          editBtn.classList.remove("text-green-600");
          deleteBtn.disabled = false;
          deleteBtn.classList.remove("opacity-50", "cursor-not-allowed");
          if (cancelBtn) cancelBtn.remove();

          // Restore original editBtn onclick
          editBtn.onclick = null;
        };
      });

      // Delete post functionality
      deleteBtn.addEventListener("click", () => {
        dropdown.classList.remove("opacity-100");
        dropdown.classList.add("opacity-0", "invisible");

        if (
          confirm(
            "Are you sure you want to delete this post? This action cannot be undone."
          )
        ) {
          // Remove post from posts array
          posts = posts.filter((p) => p.id !== post.id);
          renderPosts();
        }
      });

      return article;
    }

    // Render posts
    function renderPosts() {
      postsContainer.innerHTML = "";
      posts.forEach((post) => {
        const postEl = createPostElement(post);
        postsContainer.appendChild(postEl);
      });
    }

    renderPosts();

    // Handle post submission
    postBtn.addEventListener("click", () => {
      const text = postText.value.trim();
      const imageFiles = [...imageUpload.files];
      const videoFiles = [...videoUpload.files];
      const otherFiles = [...fileUpload.files];
      if (!text && imageFiles.length === 0 && videoFiles.length === 0 && otherFiles.length === 0) return;

      // Prepare media objects with URLs (images/videos)
      const media = [...imageFiles, ...videoFiles].map((file) => ({
        url: URL.createObjectURL(file),
        type: file.type,
        name: file.name,
      }));

      // Prepare files objects with URLs (pdf, doc, ppt)
      const files = otherFiles.map((file) => ({
        url: URL.createObjectURL(file),
        type: file.type,
        name: file.name,
      }));

      const newPost = {
        id: Date.now(),
        text,
        media,
        files,
        date: new Date(),
        views: 0,
        comments: [],
      };

      posts.unshift(newPost);
      renderPosts();

      // Clear inputs and preview
      postText.value = "";
      imageUpload.value = "";
      videoUpload.value = "";
      fileUpload.value = "";
      previewContainer.innerHTML = "";
      postBtn.disabled = true;
    });

    // Create Event modal elements
    const eventModal = document.getElementById("eventModal");
    const createEventBtnSidebar = document.getElementById("createEventBtnSidebar");
    const createEventBtnStream = document.getElementById("createEventBtnStream");
    const cancelEventBtn = document.getElementById("cancelEventBtn");
    const eventForm = document.getElementById("eventForm");
    const noUpcomingEventsText = document.getElementById("noUpcomingEventsText");

    // Show modal function
    function showEventModal() {
      eventModal.classList.remove("hidden");
      // Reset form
      eventForm.reset();
    }

    // Hide modal function
    function hideEventModal() {
      eventModal.classList.add("hidden");
    }

    createEventBtnSidebar.addEventListener("click", showEventModal);
    createEventBtnStream.addEventListener("click", showEventModal);
    cancelEventBtn.addEventListener("click", hideEventModal);

    // Upcoming events container (right sidebar)
    const upcomingEventsContainer = document.createElement("div");
    upcomingEventsContainer.className = "flex flex-col gap-2";
    // Insert after noUpcomingEventsText
    noUpcomingEventsText.insertAdjacentElement("afterend", upcomingEventsContainer);

    // Add event to events array and update UI
    eventForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("eventTitle").value.trim();
      const dateStr = document.getElementById("eventDate").value;
      const description = document.getElementById("eventDescription").value.trim();

      if (!title || !dateStr) return;

      const eventDate = new Date(dateStr + "T00:00:00");

      const newEvent = {
        id: Date.now(),
        title,
        date: eventDate,
        description,
      };

      events.push(newEvent);
      events.sort((a, b) => a.date - b.date);

      updateUpcomingEvents();
      renderCalendar();
      hideEventModal();
    });

    // Update upcoming events list in sidebar
    function updateUpcomingEvents() {
      upcomingEventsContainer.innerHTML = "";
      const today = new Date();
      const futureEvents = events.filter((ev) => ev.date >= today);
      if (futureEvents.length === 0) {
        noUpcomingEventsText.style.display = "block";
        upcomingEventsContainer.style.display = "none";
        return;
      }
      noUpcomingEventsText.style.display = "none";
      upcomingEventsContainer.style.display = "flex";

      futureEvents.forEach((ev) => {
        const evDiv = document.createElement("div");
        evDiv.className =
          "bg-sky-50 rounded-lg p-2 text-sky-700 text-[11px] cursor-default select-none";
        evDiv.title = ev.description || ev.title;
        evDiv.textContent = `${ev.date.toLocaleDateString("en-GB", {
          day: "2-digit",
          month: "short",
        })}: ${ev.title}`;
        upcomingEventsContainer.appendChild(evDiv);
      });
    }

    // Calendar rendering
    const calendarGrid = document.getElementById("calendarGrid");

    function renderCalendar() {
      calendarGrid.innerHTML = "";
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      // Get first day of month and number of days
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();

      // Day names header
      const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      dayNames.forEach((day) => {
        const dayHeader = document.createElement("div");
        dayHeader.className =
          "bg-sky-100 text-sky-700 font-semibold text-center py-1 select-none";
        dayHeader.textContent = day;
        calendarGrid.appendChild(dayHeader);
      });

      // Blank days before first day
      const startDay = firstDay.getDay();
      for (let i = 0; i < startDay; i++) {
        const blankCell = document.createElement("div");
        calendarGrid.appendChild(blankCell);
      }

      // Days with events
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dayCell = document.createElement("div");
        dayCell.setAttribute("role", "gridcell");
        dayCell.setAttribute("tabindex", "0");
        dayCell.setAttribute("aria-label", date.toDateString());

        const dateNumber = document.createElement("span");
        dateNumber.className = "date-number";
        dateNumber.textContent = day;
        dayCell.appendChild(dateNumber);

        // Add events for this day
        const dayEvents = events.filter(
          (ev) =>
            ev.date.getFullYear() === date.getFullYear() &&
            ev.date.getMonth() === date.getMonth() &&
            ev.date.getDate() === date.getDate()
        );

        dayEvents.forEach((ev) => {
          const evDiv = document.createElement("div");
          evDiv.className = "event";
          evDiv.title = ev.description || ev.title;
          evDiv.textContent = ev.title;
          dayCell.appendChild(evDiv);
        });

        calendarGrid.appendChild(dayCell);
      }
    }

    // Copy class code functionality
    const copyClassCodeBtn = document.getElementById("copyClassCodeBtn");
    const classCodeText = document.getElementById("classCodeText");
    const tooltipText = document.getElementById("tooltipText");

    function showTooltip(message) {
      tooltipText.textContent = message;
      tooltipText.style.visibility = "visible";
      tooltipText.style.opacity = "1";
      setTimeout(() => {
        tooltipText.style.visibility = "hidden";
        tooltipText.style.opacity = "0";
        tooltipText.textContent = "Copy";
      }, 1500);
    }

    copyClassCodeBtn.addEventListener("click", () => {
      const code = classCodeText.textContent.trim();
      navigator.clipboard.writeText(code).then(() => {
        showTooltip("Copied!");
      });
    });

    classCodeText.addEventListener("click", () => {
      const code = classCodeText.textContent.trim();
      navigator.clipboard.writeText(code).then(() => {
        showTooltip("Copied!");
      });
    });
    
  </script>

<script>
  function openModal() {
           document.getElementById('chatbotModal').classList.remove('hidden');
       }

       function closeModal() {
           document.getElementById('chatbotModal').classList.add('hidden');
       }
 </script>
</body>
