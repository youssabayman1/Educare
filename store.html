<html lang="en">
 <head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>EDUCARE - Publish Course</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Inter", sans-serif;
    }
    @keyframes tumble {
      0% {
        transform: rotate(0deg);
      }
      25% {
        transform: rotate(5deg);
      }
      50% {
        transform: rotate(-5deg);
      }
      75% {
        transform: rotate(5deg);
      }
      100% {
        transform: rotate(0deg);
      }
    }
    .tumble {
      animation: tumble 0.6s ease-in-out;
    }
    /* Floating larger AI companion */
    @keyframes float {
            0% {
                transform: translatey(0px);
            }
            50% {
                transform: translatey(-10px);
            }
            100% {
                transform: translatey(0px);
            }
        }
        .floating {
            animation: float 2s ease-in-out infinite;
        }

        .fade-in {
            animation: fadeIn 6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .slide-in {
            animation: slideIn 1s ease-in-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(0);
            }
        }
  </style>
 </head>
 <body class="bg-white text-gray-900 min-h-screen flex flex-col relative">
  <header
    class="flex flex-col sm:flex-row items-center justify-between px-4 sm:px-6 md:px-8 py-3 border-b border-gray-200 w-full z-20"
  >
    <div class="flex items-center space-x-3 mb-3 sm:mb-0">
      <button
        id="homeIconBtn"
        aria-label="Home"
        class="text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400 rounded p-1"
      >
        <i class="fas fa-home fa-lg"></i>
      </button>
      <img
        alt="EDUCARE logo with colorful star shapes"
        class="w-10 h-10"
        height="40"
        src="../assets/Images/Untitled design (1).png"
        width="40"
      />
      <span class="font-semibold text-lg text-blue-600 whitespace-nowrap">
        EDUCARE
      </span>
    </div>
    <div
      class="flex items-center space-x-4 w-full sm:w-auto mb-3 sm:mb-0 relative"
    >
      <button
        aria-label="Shopping cart"
        id="cartIconBtn"
        class="text-gray-400 hover:text-gray-600 flex-shrink-0 relative"
      >
        <i class="fas fa-shopping-cart fa-lg"></i>
        <span
          id="cartCount"
          class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center select-none"
          >0</span
        >
      </button>
      <div class="relative flex-grow sm:flex-grow-0 w-full sm:w-auto">
        <input
          class="border border-gray-300 rounded-md px-3 py-1 w-full sm:w-48 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
          placeholder="Search ..."
          type="search"
        />
        <button
          aria-label="Search"
          class="absolute right-1 top-1.5 text-gray-400 hover:text-gray-600"
        >
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>
    <div class="flex items-center space-x-3 relative">
      <label for="profilePicInput" class="cursor-pointer" title="Change profile picture">
        <img
          alt="User avatar of a man with beard and mustache"
          class="w-10 h-10 rounded-full border border-gray-300 hover:ring-2 hover:ring-blue-500 transition"
          height="40"
          id="profilePic"
          src="../assets/Images/AI women.jpg"
          width="40"
        />
      </label>
      <input accept="image/*" class="hidden" id="profilePicInput" type="file" />
      <div class="text-right leading-tight max-w-[80px] truncate">
        <p class="text-sm font-semibold text-gray-900">Sarah</p>
        <p class="text-xs text-gray-500">Othman</p>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 md:px-8 py-10">
    <h1 class="text-2xl font-semibold mb-6 text-gray-900">Publish a New Course</h1>
    <form id="publishCourseForm" class="space-y-6 bg-white p-6 rounded-lg shadow-md">
      <div>
        <label for="userType" class="block text-sm font-medium text-gray-700 mb-1"
          >I am a:</label
        >
        <select
          id="userType"
          name="userType"
          required
          class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
        >
          <option value="" disabled selected>Select your role</option>
          <option value="institution">Institution</option>
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
        </select>
      </div>

      <div>
        <label for="courseTitle" class="block text-sm font-medium text-gray-700 mb-1"
          >Course Title</label
        >
        <input
          type="text"
          id="courseTitle"
          name="courseTitle"
          required
          placeholder="Enter course title"
          class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
        />
      </div>

      <div>
        <label for="courseDescription" class="block text-sm font-medium text-gray-700 mb-1"
          >Course Description</label
        >
        <textarea
          id="courseDescription"
          name="courseDescription"
          rows="4"
          required
          placeholder="Describe your course"
          class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
        ></textarea>
      </div>

      <div>
        <label for="coursePrice" class="block text-sm font-medium text-gray-700 mb-1"
          >Price (LE)</label
        >
        <input
          type="number"
          id="coursePrice"
          name="coursePrice"
          min="0"
          step="0.01"
          required
          placeholder="Enter course price"
          class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
        />
      </div>

      <div>
        <label for="courseImage" class="block text-sm font-medium text-gray-700 mb-1"
          >Course Image URL</label
        >
        <input
          type="url"
          id="courseImage"
          name="courseImage"
          placeholder="https://example.com/image.jpg"
          class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 font-semibold"
      >
        Publish Course
      </button>
    </form>

    <section id="publishedCoursesSection" class="mt-12">
      <h2 class="text-xl font-semibold mb-4 text-gray-900">Published Courses</h2>
      <div
        id="publishedCoursesGrid"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
      >
        <!-- Published courses will appear here -->
      </div>
    </section>
  </main>
     <!-- Floating Avatar bottom right -->
     <div class="fixed bottom-4 right-4 floating">
        <a href="./chatbot.html" onclick="openModal()">
         <img alt="AI icon" class="w-20 h-20 rounded-full" src="../assets/Images/WhatsApp Image 2024-11-15 at 19.39.33_b2a01f1c.jpg"/>
        </a>
       </div>

  <!-- Registration Modal -->
  <div
    id="registrationModal"
    aria-hidden="true"
    class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50"
    role="dialog"
    aria-modal="true"
    aria-labelledby="registrationTitle"
    aria-describedby="registrationDesc"
  >
    <div
      class="bg-white rounded-lg max-w-md w-full p-6 relative shadow-lg mx-4 sm:mx-auto"
    >
      <button
        aria-label="Close registration modal"
        id="closeRegistrationBtn"
        class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 focus:outline-none"
      >
        <i class="fas fa-times fa-lg"></i>
      </button>
      <h3 class="text-lg font-semibold mb-4" id="registrationTitle">
        Course Added to Cart
      </h3>
      <p class="text-gray-700 mb-6" id="registrationDesc">
        The course has been added to your cart. You can proceed to checkout to complete your registration.
      </p>
      <div class="flex justify-end space-x-4">
        <button
          id="cancelRegistrationBtn"
          class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400"
          type="button"
        >
          Cancel
        </button>
        <button
          id="proceedCheckoutBtn"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
          type="button"
        >
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>

  <script>
    let publishedCourses = JSON.parse(localStorage.getItem("publishedCourses")) || [];

    const publishedCoursesGrid = document.getElementById("publishedCoursesGrid");
    const publishCourseForm = document.getElementById("publishCourseForm");

    const registrationModal = document.getElementById("registrationModal");
    const closeRegistrationBtn = document.getElementById("closeRegistrationBtn");
    const cancelRegistrationBtn = document.getElementById("cancelRegistrationBtn");
    const proceedCheckoutBtn = document.getElementById("proceedCheckoutBtn");

    // Cart management in localStorage
    function getCart() {
      const cart = localStorage.getItem("educareCart");
      return cart ? JSON.parse(cart) : [];
    }
    function setCart(cart) {
      localStorage.setItem("educareCart", JSON.stringify(cart));
      updateCartCount();
    }
    function updateCartCount() {
      const cart = getCart();
      const cartCount = document.getElementById("cartCount");
      cartCount.textContent = cart.length;
      cartCount.style.display = cart.length > 0 ? "flex" : "none";
    }
    function addToCartPublished(course) {
      const cart = getCart();
      if (!cart.some((c) => c.title === course.title)) {
        cart.push(course);
        setCart(cart);
        return true;
      }
      return false;
    }

    // Render published courses
    function renderPublishedCourses() {
      publishedCoursesGrid.innerHTML = "";
      if (publishedCourses.length === 0) {
        publishedCoursesGrid.innerHTML =
          '<p class="text-gray-600 col-span-full">No courses published yet.</p>';
        return;
      }
      publishedCourses.forEach((course, index) => {
        const courseCard = document.createElement("article");
        courseCard.className =
          "border border-gray-200 rounded-lg p-4 flex flex-col space-y-3 hover:shadow-md transition-shadow duration-200 tumble cursor-pointer";
        courseCard.setAttribute("tabindex", "0");
        courseCard.setAttribute("role", "button");
        courseCard.setAttribute("aria-pressed", "false");
        courseCard.setAttribute("aria-label", `View details for ${course.title}`);

        courseCard.innerHTML = `
          <img
            alt="Course image for ${course.title}"
            class="w-full h-40 object-contain rounded"
            src="${course.image || 'https://placehold.co/240x160?text=No+Image'}"
            height="160"
            width="240"
          />
          <h4 class="text-sm font-semibold text-gray-900 truncate">${course.title}</h4>
          <p class="text-xs text-gray-500 truncate">Published by: ${course.userType}</p>
          <div class="flex items-center space-x-1 text-yellow-400 rating-stars" data-course="published-${index}" role="radiogroup" aria-label="Rate ${course.title}">
            <i class="far fa-star cursor-pointer" data-value="1" role="radio" aria-checked="false" tabindex="-1"></i>
            <i class="far fa-star cursor-pointer" data-value="2" role="radio" aria-checked="false" tabindex="-1"></i>
            <i class="far fa-star cursor-pointer" data-value="3" role="radio" aria-checked="false" tabindex="-1"></i>
            <i class="far fa-star cursor-pointer" data-value="4" role="radio" aria-checked="false" tabindex="-1"></i>
            <i class="far fa-star cursor-pointer" data-value="5" role="radio" aria-checked="false" tabindex="-1"></i>
          </div>
          <p class="text-xs font-bold text-gray-900 truncate">LE ${parseFloat(course.price).toFixed(2)}</p>
          <button class="mt-auto bg-blue-600 text-white text-xs font-semibold py-2 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400" data-course="published-${index}" type="button" aria-label="Add ${course.title} to cart">
            Add to cart
          </button>
        `;

        publishedCoursesGrid.appendChild(courseCard);
      });

      attachPublishedCourseEvents();
    }

    // Attach rating and add to cart events for published courses
    function attachPublishedCourseEvents() {
      document.querySelectorAll(".rating-stars").forEach((container) => {
        let currentRating = 0; // start empty
        updateStars(container, currentRating);

        container.addEventListener("click", (e) => {
          if (e.target.tagName === "I") {
            const selectedRating = parseInt(e.target.getAttribute("data-value"));
            currentRating = selectedRating;
            updateStars(container, selectedRating);
            const card = container.closest("article");
            card.classList.remove("tumble");
            void card.offsetWidth;
            card.classList.add("tumble");
          }
        });

        container.querySelectorAll("i").forEach((star) => {
          star.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              const selectedRating = parseInt(star.getAttribute("data-value"));
              currentRating = selectedRating;
              updateStars(container, selectedRating);
              const card = container.closest("article");
              card.classList.remove("tumble");
              void card.offsetWidth;
              card.classList.add("tumble");
            }
            if (e.key === "ArrowRight" || e.key === "ArrowUp") {
              e.preventDefault();
              let next = star.nextElementSibling;
              if (next) next.focus();
            }
            if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
              e.preventDefault();
              let prev = star.previousElementSibling;
              if (prev) prev.focus();
            }
          });
        });
      });

      document.querySelectorAll("button[data-course]").forEach((button) => {
        button.addEventListener("click", (e) => {
          e.stopPropagation();
          const courseId = button.getAttribute("data-course");
          if (courseId.startsWith("published-")) {
            const index = parseInt(courseId.split("-")[1]);
            if (!isNaN(index) && publishedCourses[index]) {
              const added = addToCartPublished(publishedCourses[index]);
              if (added) {
                openRegistrationModal();
              } else {
                alert(`"${publishedCourses[index].title}" is already in your cart.`);
              }
            }
          }
        });
      });
    }

    function updateStars(container, rating) {
      const stars = container.querySelectorAll("i");
      stars.forEach((star) => {
        const val = parseInt(star.getAttribute("data-value"));
        if (val <= rating) {
          star.classList.remove("far");
          star.classList.add("fas");
          star.setAttribute("aria-checked", "true");
          star.setAttribute("tabindex", "0");
        } else {
          star.classList.remove("fas");
          star.classList.add("far");
          star.setAttribute("aria-checked", "false");
          star.setAttribute("tabindex", "-1");
        }
      });
    }

    // Modal open/close for registration
    function openRegistrationModal() {
      registrationModal.classList.remove("hidden");
      proceedCheckoutBtn.focus();
    }
    function closeRegistrationModal() {
      registrationModal.classList.add("hidden");
    }

    closeRegistrationBtn.addEventListener("click", closeRegistrationModal);
    cancelRegistrationBtn.addEventListener("click", closeRegistrationModal);

    proceedCheckoutBtn.addEventListener("click", () => {
      closeRegistrationModal();
      // Redirect to checkout page with all cart courses
      const cart = getCart();
      if (cart.length === 0) return;
      const params = new URLSearchParams();
      cart.forEach((c) => params.append("courseId", c.title));
      window.location.href = `checkout.html?${params.toString()}`;
    });

    // Handle form submission to add new course
    publishCourseForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const userType = e.target.userType.value;
      const title = e.target.courseTitle.value.trim();
      const description = e.target.courseDescription.value.trim();
      const price = parseFloat(e.target.coursePrice.value);
      const image = e.target.courseImage.value.trim();

      if (!userType || !title || !description || isNaN(price) || price < 0) {
        alert("Please fill all required fields correctly.");
        return;
      }

      const newCourse = {
        userType,
        title,
        description,
        price,
        image: image || null,
        rating: 0,
      };

      publishedCourses.push(newCourse);
      localStorage.setItem("publishedCourses", JSON.stringify(publishedCourses));
      renderPublishedCourses();
      e.target.reset();
      alert("Course published successfully!");
    });

    // Navigation buttons
    const homeIconBtn = document.getElementById("homeIconBtn");
    homeIconBtn.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    // Profile picture change logic
    const profilePicInput = document.getElementById("profilePicInput");
    const profilePic = document.getElementById("profilePic");
    profilePicInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file && file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function (event) {
          profilePic.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Initial render
    renderPublishedCourses();
    updateCartCount();
  </script>
 </body>
</html>
