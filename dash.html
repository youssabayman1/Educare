   /* Custom style for create and join buttons to match typical style in image */
   /* #action-buttons button {
     @apply rounded-lg px-4 py-2 text-xs font-semibold transition-colors duration-200;
     box-shadow: 0 2px 6px rgba(13, 140, 240, 0.3);
     min-width: 72px;
   } */
   #create-btn {
     background-color: #b7d9ef;
     color: #0d8cf0;
   }
   #create-btn:hover {
     background-color: #a0c9e8;
     box-shadow: 0 4px 12px rgba(13, 140, 240, 0.5);
   }
   #join-btn {
     background-color: #b7d9ef;
     color: #0d8cf0;
   }
   #join-btn:hover {
     background-color: #a0c9e8;
     box-shadow: 0 4px 12px rgba(13, 140, 240, 0.5);
   }
   /* Icon size adjustment */
   #action-buttons button img {
     width: 18px;
     height: 18px;
   }
   /* Smooth show/hide for action buttons container */
   #action-buttons {
     max-height: 0;
     overflow: hidden;
     opacity: 0;
     transition: max-height 0.4s ease, opacity 0.4s ease;
     display: flex;
   }
   #action-buttons.show {
     max-height: 100px; /* enough to show buttons */
     opacity: 1;
   }
   /* Profile image cursor */
   #profile-pic {
     cursor: pointer;
   }
   /* Hide default file input */
   #profile-upload {
     display: none;
   }
   /* Floating larger AI companion */
   @keyframes float {
            0% {
                transform: translatey(0px);
            }
            50% {
                transform: translatey(-10px);
            }
            100% {
                transform: translatey(0px);
            }
        }
        .floating {
            animation: float 2s ease-in-out infinite;
        }

        .fade-in {
            animation: fadeIn 6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .slide-in {
            animation: slideIn 1s ease-in-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(0);
            }
        }
        /* Sidebar blue icons */
    nav a .bi {
      color: #0d8cf0;
      font-size: 1.25rem;

    /* nav a {

         /* Modal backdrop */

    /* Chat modal container */
    #chat-modal .modal-content {
      width: 360px;
      max-width: 90vw;
      height: 500px;
      background: #fff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
    /* Chat header */
    #chat-modal .modal-header {
      background: #075e54;
      color: white;
      padding: 12px 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #chat-modal .modal-header .title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #chat-modal .modal-header .title img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #25d366;
    }
    #chat-modal .modal-header button {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.25rem;
      cursor: pointer;
    }
    /* Chat messages area */
    #chat-modal .modal-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #ece5dd;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    /* Chat input area */
    #chat-modal .modal-footer {
      padding: 8px 12px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #chat-modal .modal-footer textarea {
      flex: 1;
      resize: none;
      border-radius: 20px;
      border: 1px solid #ccc;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
      height: 40px;
    }
    #chat-modal .modal-footer button {
      background: #25d366;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background-color 0.2s ease;
    }
    #chat-modal .modal-footer button:hover {
      background: #1ebe57;
    }
    /* Message bubbles */
    .message {
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.2;
      word-wrap: break-word;
    }
    .message.sent {
      background: #dcf8c6;
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }
    .message.received {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }
    /* Media messages */
    .message img,
    .message video,
    .message audio {
      max-width: 100%;
      border-radius: 8px;
      display: block;
    }
   /* Classroom card image */
   .classroom-image {
     width: 100%;
     height: 120px;
     object-fit: cover;
     border-radius: 0.5rem;
     margin-bottom: 0.5rem;
     cursor: pointer;
     position: relative;
   }
   .classroom-card {
     position: relative;
     cursor: pointer;
     opacity: 0;
     transform: scale(0.9);
     animation: popIn 0.4s forwards;
   }
   .classroom-card:hover {
     box-shadow: 0 8px 20px rgba(13, 140, 240, 0.4);
     transform: scale(1.05);
     transition: transform 0.3s ease, box-shadow 0.3s ease;
     z-index: 10;
   }
   /* Hidden file input for classroom image */
   .classroom-image-upload {
     display: none;
   }
   /* Plus button animation */
   #plus-btn {
     animation: pulseScale 2s infinite;
     transition: transform 0.3s ease;
   }
   #plus-btn:hover {
     transform: scale(1.15);
     animation-play-state: paused;
   }
   /* Empty state style */
   #empty-state {
     flex: 1;
     display: flex;
     align-items: center;
     justify-content: center;
     color: #6b7280; /* Tailwind gray-500 */
     font-size: 1.125rem; /* text-lg */
     font-weight: 500;
     user-select: none;
   }
   @keyframes popIn {
     to {
       opacity: 1;
       transform: scale(1);
     }
   }
   @keyframes pulseScale {
     0%, 100% {
       transform: scale(1);
     }
     50% {
       transform: scale(1.1);
     }
   }

  <script>
   const plusIcon = document.getElementById('plus-icon');
   const actionButtons = document.getElementById('action-buttons');
   const createBtn = document.getElementById('create-btn');
   const joinBtn = document.getElementById('join-btn');

   const modalCreate = document.getElementById('modal-create');
   const closeModalCreateBtn = document.getElementById('close-modal-create');
   const cancelBtnCreate = document.getElementById('cancel-btn-create');

   const modalJoin = document.getElementById('modal-join');
   const closeModalJoinBtn = document.getElementById('close-modal-join');
   const cancelBtnJoin = document.getElementById('cancel-btn-join');

   const modalCode = document.getElementById('modal-code');
   const closeModalCodeBtn = document.getElementById('close-modal-code');
   const copyCodeBtn = document.getElementById('copy-code-btn');
   const classroomCodeDisplay = document.getElementById('classroom-code-display');

   const cartIconBtn = document.getElementById('cartIconBtn');
   const profilePic = document.getElementById('profile-pic');
   const profileUpload = document.getElementById('profile-upload');

   const classroomsContainer = document.getElementById('classrooms-container');
   const createClassroomForm = document.getElementById('create-classroom-form');
   const emptyState = document.getElementById('empty-state');

   // Function to update empty state visibility
   function updateEmptyState() {
     if (classroomsContainer.children.length === 0) {
       emptyState.classList.remove('hidden');
     } else {
       emptyState.classList.add('hidden');
     }
   }

   // Initial check
   updateEmptyState();

   // Fix: Show/hide action buttons on plus button click
   plusIcon.addEventListener('click', (e) => {
     e.stopPropagation();
     if (actionButtons.classList.contains('show')) {
       actionButtons.classList.remove('show');
       createBtn.classList.remove('hidden');
       joinBtn.classList.remove('hidden');
     } else {
       actionButtons.classList.add('show');
       createBtn.classList.remove('hidden');
       joinBtn.classList.remove('hidden');
     }
   });

   // Hide action buttons if clicking outside
   document.addEventListener('click', () => {
     if (actionButtons.classList.contains('show')) {
       actionButtons.classList.remove('show');
       createBtn.classList.remove('hidden');
       joinBtn.classList.remove('hidden');
     }
   });

   createBtn.addEventListener('click', (e) => {
     e.stopPropagation();
     modalCreate.classList.remove('hidden');
     joinBtn.classList.add('hidden');
     createBtn.classList.remove('hidden');
     actionButtons.classList.remove('show');
   });

   closeModalCreateBtn.addEventListener('click', () => {
     modalCreate.classList.add('hidden');
     joinBtn.classList.remove('hidden');
   });

   cancelBtnCreate.addEventListener('click', () => {
     modalCreate.classList.add('hidden');
     joinBtn.classList.remove('hidden');
   });

   joinBtn.addEventListener('click', (e) => {
     e.stopPropagation();
     modalJoin.classList.remove('hidden');
     createBtn.classList.add('hidden');
     joinBtn.classList.remove('hidden');
     actionButtons.classList.remove('show');
   });

   closeModalJoinBtn.addEventListener('click', () => {
     modalJoin.classList.add('hidden');
     createBtn.classList.remove('hidden');
   });

   cancelBtnJoin.addEventListener('click', () => {
     modalJoin.classList.add('hidden');
     createBtn.classList.remove('hidden');
   });

   modalCreate.addEventListener('click', (e) => {
     if (e.target === modalCreate) {

   profileUpload.addEventListener('change', (event) => {

     if (file) {
       const reader = new FileReader();
       reader.onload = function(e) {
         profilePic.src = e.target.result;
       };

   // Generate a random classroom code (6 uppercase alphanumeric)
   function generateClassroomCode() {
     const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
     let code = '';
     for (let i = 0; i < 6; i++) {
       code += chars.charAt(Math.floor(Math.random() * chars.length));
     }
     return code;
   }

   // Function to create classroom card element with code display and editable image
   function createClassroomCard({name, description, subject, room, code}) {
     const card = document.createElement('div');
     card.className = 'bg-[#e6f0fa] rounded-lg p-4 shadow cursor-pointer hover:shadow-lg transition-shadow duration-200 flex flex-col classroom-card';

     // Image container with hidden file input
     const imgContainer = document.createElement('div');
     imgContainer.className = 'relative';

     const img = document.createElement('img');
     img.className = 'classroom-image';
     img.src = 'https://placehold.co/400x240?text=Classroom+Image';
     img.alt = `Classroom ${name} image`;
     img.title = 'Click to change classroom image';

     const fileInput = document.createElement('input');
     fileInput.type = 'file';
     fileInput.accept = 'image/*';
     fileInput.className = 'classroom-image-upload';
     fileInput.setAttribute('aria-label', `Upload image for classroom ${name}`);

     // Clicking image triggers file input
     img.addEventListener('click', (e) => {
       e.stopPropagation(); // prevent card click navigation
       fileInput.click();
     });

     // When file selected, update image src
     fileInput.addEventListener('change', (e) => {
       const file = e.target.files[0];
       if (file) {
         const reader = new FileReader();
         reader.onload = function(ev) {
           img.src = ev.target.result;
         };
         reader.readAsDataURL(file);
       }
     });

     imgContainer.appendChild(img);
     imgContainer.appendChild(fileInput);

     const title = document.createElement('h3');
     title.className = 'font-semibold text-lg text-[#0d8cf0] mb-1 truncate';
     title.textContent = name;

     const subj = document.createElement('p');
     subj.className = 'text-xs text-gray-600 mb-2 truncate';
     subj.textContent = `Subject: ${subject}`;

     const desc = document.createElement('p');
     desc.className = 'text-xs text-gray-700 flex-1 mb-2 overflow-hidden';
     desc.textContent = description;

     const roomLink = document.createElement('a');
     roomLink.className = 'text-xs text-[#0d8cf0] hover:underline truncate';
     roomLink.href = room;
     roomLink.target = '_blank';
     roomLink.rel = 'noopener noreferrer';
     roomLink.textContent = 'Room / Link';

     // Display classroom code for invitation
     const codeDisplay = document.createElement('div');
     codeDisplay.className = 'mt-2 text-xs font-mono text-center bg-white rounded px-2 py-1 border border-gray-300 select-all cursor-pointer';
     codeDisplay.title = 'Click to copy classroom code';
     codeDisplay.textContent = `Code: ${code}`;

     // Copy code to clipboard on click
     codeDisplay.addEventListener('click', (e) => {
       e.stopPropagation(); // prevent card click navigation
       navigator.clipboard.writeText(code).then(() => {
         alert(`Classroom code "${code}" copied to clipboard!`);
       });
     });

     card.appendChild(imgContainer);
     card.appendChild(title);
     card.appendChild(subj);
     card.appendChild(desc);
     card.appendChild(roomLink);
     card.appendChild(codeDisplay);

     // Navigate to classroom page on card click
     card.addEventListener('click', () => {
       // Navigate to classroom page using code or name (URL-encoded)
       // Example URL: /classroom/{code}
       const classroomUrl = `/classroom/${encodeURIComponent(code)}`;
       window.location.href = classroomUrl;
     });

     return card;
   }

   // Handle classroom creation form submit
   createClassroomForm.addEventListener('submit', (e) => {
     e.preventDefault();

     const formData = new FormData(createClassroomForm);
     const classroomData = {
       name: formData.get('name').trim(),
       description: formData.get('description').trim(),
       subject: formData.get('subject').trim(),
       room: formData.get('room').trim(),
       code: generateClassroomCode()
     };

     // Basic validation
     if (!classroomData.name || !classroomData.description || !classroomData.subject || !classroomData.room) {
       alert('Please fill in all fields.');
       return;
     }

     // Create card and append to container
     const card = createClassroomCard(classroomData);
     classroomsContainer.appendChild(card);

     // Hide empty state message after adding a card
     emptyState.style.display = 'none';

     // Close modal and reset form
     modalCreate.classList.add('hidden');
     joinBtn.classList.remove('hidden');
     createClassroomForm.reset();

     // Optionally hide action buttons after creation
     actionButtons.classList.remove('show');

     // Show classroom code modal with the generated code
     classroomCodeDisplay.textContent = classroomData.code;
     modalCode.classList.remove('hidden');
   });

   // Close classroom code modal
   closeModalCodeBtn.addEventListener('click', () => {
     modalCode.classList.add('hidden');
   });

   // Copy code button in modal
   copyCodeBtn.addEventListener('click', () => {
     const code = classroomCodeDisplay.textContent;
     navigator.clipboard.writeText(code).then(() => {
       alert(`Classroom code "${code}" copied to clipboard!`);
     });
   });

   // Logout button navigates to home page
   const logoutBtn = document.getElementById('logout-btn');
   logoutBtn.addEventListener('click', () => {
     window.location.href = '/';
   });

   <script>
    const aiCompanion = document.getElementById("chatbotModal");
    const chatModal = document.getElementById("chat-modal");
    const closeChatBtn = document.getElementById("close-chat");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const chatMessages = document.getElementById("chat-messages");
    const mediaBtn = document.getElementById("media-btn");
    const chatMediaInput = document.getElementById("chat-media-input");

    // Show chat modal on AI companion click
    aiCompanion.addEventListener("click", () => {
      chatModal.classList.remove("hidden");
      chatInput.focus();
    });

    // Close chat modal
    closeChatBtn.addEventListener("click", () => {
      chatModal.classList.add("hidden");
    });

    // Send text message
    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      // Append user message
      const userMsg = document.createElement("div");
      userMsg.className = "message sent";
      userMsg.textContent = text;
      chatMessages.appendChild(userMsg);

      chatInput.value = "";
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // Simulate AI response
      setTimeout(() => {
        const aiMsg = document.createElement("div");
        aiMsg.className = "message received";
        aiMsg.textContent = "I'm here to help! You said: " + text;
        chatMessages.appendChild(aiMsg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 1000);
    });

    // Open file input on media button click
    mediaBtn.addEventListener("click", () => {
      chatMediaInput.click();
    });

    // Handle media file selection
    chatMediaInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const fileType = file.type;
      const reader = new FileReader();

      reader.onload = function (event) {
        const mediaUrl = event.target.result;
        const mediaMsg = document.createElement("div");
        mediaMsg.className = "message sent";

        if (fileType.startsWith("audio/")) {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = mediaUrl;
          mediaMsg.appendChild(audio);
        } else if (fileType.startsWith("video/")) {
          const video = document.createElement("video");
          video.controls = true;
          video.src = mediaUrl;
          video.style.maxHeight = "200px";
          mediaMsg.appendChild(video);
        } else {
          // For other file types, just show file name
          mediaMsg.textContent = file.name;
        }

        chatMessages.appendChild(mediaMsg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      };

      reader.readAsDataURL(file);
      // Reset input so same file can be selected again if needed
      chatMediaInput.value = "";
    });

    // Close modal on clicking outside content
    chatModal.addEventListener("click", (e) => {
      if (e.target === chatModal) {
        chatModal.classList.add("hidden");
      }
    });

     // Cart icon click navigates to cart page
     cartIconBtn.addEventListener('click', () => {
      window.location.href = 'cart.html';
    });
  </script>
