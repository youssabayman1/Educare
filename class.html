  <script>
    const postText = document.getElementById("postText");
    const postButton = document.getElementById("postButton");
    const postsContainer = document.getElementById("postsContainer");
    const mediaPreview = document.querySelector(".media-preview");

    // Text control buttons
    const btnBold = document.getElementById("btnBold");
    const btnItalic = document.getElementById("btnItalic");
    const btnUnderline = document.getElementById("btnUnderline");
    const btnOrderedList = document.getElementById("btnOrderedList");
    const btnUnorderedList = document.getElementById("btnUnorderedList");

    // Media buttons and inputs
    const photoVideoBtn = document.getElementById("photoVideoBtn");
    const uploadFileBtn = document.getElementById("uploadFileBtn");
    const addVideoBtn = document.getElementById("addVideoBtn");
    const photoVideoInput = document.getElementById("photoVideoInput");
    const fileInput = document.getElementById("fileInput");
    const videoInput = document.getElementById("videoInput");

    // Comment modal elements
    const commentModal = document.getElementById("commentModal");
    const commentText = document.getElementById("commentText");
    const postCommentBtn = document.getElementById("postCommentBtn");
    const closeCommentModalBtn = document.getElementById("closeCommentModalBtn");

    let currentCommentPost = null;

    // Store selected media files for posting
    let selectedMediaFiles = [];

    // Enable post button if contenteditable has content (text or html) or media selected
    function checkPostButton() {
      const text = postText.innerText.trim();
      postButton.disabled = text === "" && selectedMediaFiles.length === 0;
    }
    postText.addEventListener("input", checkPostButton);

    // Text formatting functions using document.execCommand
    function execCommand(command) {
      postText.focus();
      document.execCommand(command, false, null);
    }

    btnBold.addEventListener("click", () => execCommand("bold"));
    btnItalic.addEventListener("click", () => execCommand("italic"));
    btnUnderline.addEventListener("click", () => execCommand("underline"));
    btnOrderedList.addEventListener("click", () => execCommand("insertOrderedList"));
    btnUnorderedList.addEventListener("click", () => execCommand("insertUnorderedList"));

    // Media buttons triggers
    photoVideoBtn.addEventListener("click", () => photoVideoInput.click());
    uploadFileBtn.addEventListener("click", () => fileInput.click());
    addVideoBtn.addEventListener("click", () => videoInput.click());

    // Helper to create preview elements
    function createPreviewElement(file) {
      if (file.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.alt = file.name;
        img.className = "rounded max-w-full max-h-48";
        return img;
      } else if (file.type.startsWith("video/")) {
        const video = document.createElement("video");
        video.src = URL.createObjectURL(file);
        video.controls = true;
        video.className = "rounded max-w-full max-h-48";
        return video;
      } else {
        const link = document.createElement("a");
        link.href = "#";
        link.textContent = file.name;
        link.className = "underline text-blue-600 block my-2";
        return link;
      }
    }
      // Upload file button triggers hidden file input
      uploadFileBtn.addEventListener('click', () => {
        fileInput.click();
      });

    // Clear previews
    function clearPreviews() {
      mediaPreview.innerHTML = "";
      selectedMediaFiles.forEach((file) => {
        if (file.previewUrl) URL.revokeObjectURL(file.previewUrl);
      });
      selectedMediaFiles = [];
    }

    // Handle photo/video input change
    photoVideoInput.addEventListener("change", () => {
      clearPreviews();
      if (photoVideoInput.files.length === 0) return;
      selectedMediaFiles = Array.from(photoVideoInput.files).map((file) => {
        file.previewUrl = URL.createObjectURL(file);
        return file;
      });
      selectedMediaFiles.forEach((file) => {
        const preview = createPreviewElement(file);
        mediaPreview.appendChild(preview);
      });
      photoVideoInput.value = "";
      checkPostButton();
    });

    // Handle file input change
    fileInput.addEventListener("change", () => {
      clearPreviews();
      if (fileInput.files.length === 0) return;
      selectedMediaFiles = Array.from(fileInput.files).map((file) => {
        file.previewUrl = URL.createObjectURL(file);
        return file;
      });
      selectedMediaFiles.forEach((file) => {
        const preview = createPreviewElement(file);
        mediaPreview.appendChild(preview);
      });
      fileInput.value = "";
      checkPostButton();
    });

    // Handle video input change
    videoInput.addEventListener("change", () => {
      clearPreviews();
      if (videoInput.files.length === 0) return;
      selectedMediaFiles = Array.from(videoInput.files).map((file) => {
        file.previewUrl = URL.createObjectURL(file);
        return file;
      });
      selectedMediaFiles.forEach((file) => {
        const preview = createPreviewElement(file);
        mediaPreview.appendChild(preview);
      });
      videoInput.value = "";
      checkPostButton();
    });

    // Post button click
    postButton.addEventListener("click", () => {
      const htmlContent = postText.innerHTML.trim();
      if (htmlContent === "" && selectedMediaFiles.length === 0) return;

      // Create new post article
      const postArticle = createTextPost(htmlContent, selectedMediaFiles);

      // Add new post at the top
      postsContainer.insertBefore(postArticle, postsContainer.firstChild);

      // Clear input and disable post button
      postText.innerHTML = "";
      clearPreviews();
      checkPostButton();
    });

    // Create post helper with media
    function createTextPost(htmlContent, mediaFiles) {
      const postArticle = document.createElement("article");
      postArticle.className =
        "bg-white border border-[#E6E9F0] rounded-[20px] p-6 flex flex-col gap-4";

      const headerDiv = document.createElement("div");
      headerDiv.className = "flex items-center gap-4";

      const avatarImg = document.createElement("img");
      avatarImg.src =
        "https://storage.googleapis.com/a1aa/image/22c46531-9512-4c0f-4521-5c7172eae9e1.jpg";
      avatarImg.alt =
        "Profile avatar of Sarah Othman with short brown hair and blue shirt";
      avatarImg.className = "w-10 h-10 rounded-full object-cover";
      avatarImg.height = 40;
      avatarImg.width = 40;

      const nameSpan = document.createElement("span");
      nameSpan.className = "text-sm font-semibold text-[#111827]";
      nameSpan.textContent = "Sarah othman";

      headerDiv.appendChild(avatarImg);
      headerDiv.appendChild(nameSpan);

      const contentDiv = document.createElement("div");
      contentDiv.className = "text-xs text-[#6B7280] whitespace-pre-wrap";
      contentDiv.innerHTML = htmlContent;

      postArticle.appendChild(headerDiv);
      postArticle.appendChild(contentDiv);

      // Add media previews if any
      if (mediaFiles && mediaFiles.length > 0) {
        const mediaContainer = document.createElement("div");
        mediaContainer.className = "flex flex-col gap-4 max-w-full overflow-auto";

        mediaFiles.forEach((file) => {
          if (file.type.startsWith("image/")) {
            const img = document.createElement("img");
            img.src = file.previewUrl;
            img.alt = file.name;
            img.className = "max-h-60 rounded";
            mediaContainer.appendChild(img);
          } else if (file.type.startsWith("video/")) {
            const video = document.createElement("video");
            video.src = file.previewUrl;
            video.controls = true;
            video.className = "max-h-60 rounded";
            mediaContainer.appendChild(video);
          } else {
            const link = document.createElement("a");
            link.href = "#";
            link.textContent = file.name;
            link.className = "underline text-blue-600 block my-2";
            mediaContainer.appendChild(link);
          }
        });

        postArticle.appendChild(mediaContainer);
      }

      const footerDiv = createPostFooter(postArticle);

      postArticle.appendChild(footerDiv);

      return postArticle;
    }

    function createPostFooter(postArticle) {
      const footerDiv = document.createElement("div");
      footerDiv.className = "flex justify-end items-center gap-6";

      const commentBtn = document.createElement("button");
      commentBtn.className =
        "flex items-center gap-2 text-[#3B82F6] text-xs font-semibold comment-btn";
      commentBtn.type = "button";
      commentBtn.innerHTML = '<i class="fas fa-comment"></i> Comment';

      const viewsBtn = document.createElement("button");
      viewsBtn.className = "flex items-center gap-2 text-[#3B82F6] text-xs font-semibold";
      viewsBtn.type = "button";
      viewsBtn.innerHTML = '<i class="far fa-eye"></i> 0 views';

      const moreDiv = document.createElement("div");
      moreDiv.className = "relative group";

      const moreBtn = document.createElement("button");
      moreBtn.className =
        "text-[#3B82F6] text-xs font-semibold px-3 py-2 rounded hover:bg-[#E0E7FF]";
      moreBtn.type = "button";
      moreBtn.setAttribute("aria-haspopup", "true");
      moreBtn.setAttribute("aria-expanded", "false");
      moreBtn.setAttribute("aria-label", "More options");
      moreBtn.innerHTML = '<i class="fas fa-ellipsis-h"></i>';

      const dropdownDiv = document.createElement("div");
      dropdownDiv.className =
        "hidden group-hover:block absolute right-0 top-full mt-2 bg-white border border-[#E6E9F0] rounded-lg shadow-lg w-24 text-xs text-[#3B82F6] font-semibold";

      const editBtn = document.createElement("button");
      editBtn.className = "block w-full text-left px-4 py-2 hover:bg-[#E0E7FF]";
      editBtn.type = "button";
      editBtn.textContent = "Edit";

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "block w-full text-left px-4 py-2 hover:bg-[#E0E7FF]";
      deleteBtn.type = "button";
      deleteBtn.textContent = "Delete";

      dropdownDiv.appendChild(editBtn);
      dropdownDiv.appendChild(deleteBtn);

      moreDiv.appendChild(moreBtn);
      moreDiv.appendChild(dropdownDiv);

      footerDiv.appendChild(commentBtn);
      footerDiv.appendChild(viewsBtn);
      footerDiv.appendChild(moreDiv);

      // Toggle dropdown on moreBtn click
      moreBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isVisible = dropdownDiv.style.display === "block";
        // Close all other dropdowns
        document.querySelectorAll(".dropdown-menu-visible").forEach((el) => {
          el.style.display = "none";
          el.classList.remove("dropdown-menu-visible");
        });
        if (!isVisible) {
          dropdownDiv.style.display = "block";
          dropdownDiv.classList.add("dropdown-menu-visible");
        }
      });

      // Close dropdown if clicking outside
      document.addEventListener("click", () => {
        if (dropdownDiv.style.display === "block") {
          dropdownDiv.style.display = "none";
          dropdownDiv.classList.remove("dropdown-menu-visible");
        }
      });

      // Edit functionality
      editBtn.addEventListener("click", () => {
        dropdownDiv.style.display = "none";
        const contentDiv = postArticle.querySelector("div:nth-child(2)");
        if (contentDiv.isContentEditable) {
          // Save edit
          contentDiv.contentEditable = "false";
          editBtn.textContent = "Edit";
          contentDiv.classList.remove("post-content");
        } else {
          // Enable edit
          contentDiv.contentEditable = "true";
          contentDiv.focus();
          editBtn.textContent = "Save";
          contentDiv.classList.add("post-content");
        }
      });

      // Delete functionality
      deleteBtn.addEventListener("click", () => {
        postArticle.remove();
      });

      // Comment functionality
      commentBtn.addEventListener("click", () => {
        currentCommentPost = postArticle;
        commentText.value = "";
        commentModal.classList.remove("hidden");
      });

      return footerDiv;
    }

    // Close comment modal
    closeCommentModalBtn.addEventListener("click", () => {
      commentModal.classList.add("hidden");
      currentCommentPost = null;
    });

    // Post comment
    postCommentBtn.addEventListener("click", () => {
      if (!currentCommentPost) return;
      const comment = commentText.value.trim();
      if (comment === "") return;

      // Create comment element with profile picture on left
      const commentDiv = document.createElement("div");
      commentDiv.className = "mt-2 flex items-start gap-3 ml-12";

      const commenterImg = document.createElement("img");
      commenterImg.src = "https://storage.googleapis.com/a1aa/image/22c46531-9512-4c0f-4521-5c7172eae9e1.jpg";
      commenterImg.alt = "Commenter profile picture";
      commenterImg.className = "w-6 h-6 rounded-full object-cover mt-1 flex-shrink-0";

      const commentTextDiv = document.createElement("div");
      commentTextDiv.className = "p-2 bg-gray-100 rounded text-xs text-gray-700 flex-1";
      commentTextDiv.textContent = comment;

      commentDiv.appendChild(commenterImg);
      commentDiv.appendChild(commentTextDiv);

      // Append comment to post (create comments container if not exists)
      let commentsContainer = currentCommentPost.querySelector(".comments-container");
      if (!commentsContainer) {
        commentsContainer = document.createElement("div");
        commentsContainer.className = "comments-container mt-4 border-t border-gray-200 pt-2";
        currentCommentPost.appendChild(commentsContainer);
      }
      commentsContainer.appendChild(commentDiv);

      commentModal.classList.add("hidden");
      currentCommentPost = null;
    });
  </script>
</body>
</html>
