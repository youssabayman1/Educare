<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Sign Up
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
      font-family: 'Inter', sans-serif;
      background: #f9fafb;
    }
  </style>
 </head>
 <body>
  <div class="min-h-screen flex items-center justify-center px-6 py-16 bg-gray-50">
   <div class="w-full max-w-3xl bg-white rounded-3xl shadow-xl p-12 flex flex-col md:flex-row md:space-x-12">
    <!-- Left side image or illustration placeholder -->
    <div class="hidden md:flex flex-1 items-center justify-center">
     <img alt="Illustration showing a person signing up on a website" class="rounded-2xl shadow-lg" height="400" src="../assets/Images/Learning-rafiki.png" width="400"/>
    </div>
    <!-- Form container -->
    <div class="flex-1 max-w-md mx-auto">
     <h1 class="text-4xl font-semibold text-gray-900 mb-10 text-center md:text-left">
      Sign Up
     </h1>
     <form class="space-y-7">
      <div>
       <label class="block mb-2 text-sm font-medium text-gray-700" for="email">
        Email address
       </label>
       <input class="w-full border border-gray-300 rounded-xl px-5 py-3 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-blue-500 transition" id="email" placeholder="Enter your email" type="email"/>
      </div>
      <div>
       <label class="block mb-2 text-sm font-medium text-gray-700" for="password">
        Password
       </label>
       <input class="w-full border border-gray-300 rounded-xl px-5 py-3 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" id="password" placeholder="Password" type="password"/>
      </div>
      <div>
       <label class="block mb-2 text-sm font-medium text-gray-700" for="confirm-password">
        Confirm Password
       </label>
       <input class="w-full border border-gray-300 rounded-xl px-5 py-3 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" id="confirm-password" placeholder="Confirm Password" type="password"/>
      </div>
      <div class="flex items-center space-x-3">
       <input class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500" id="terms" type="checkbox"/>
       <label class="text-sm text-gray-700 select-none" for="terms">
        I agree to the
        <a class="text-blue-600 underline hover:text-blue-800" href="#">
         Terms and Conditions
        </a>
       </label>
      </div>
      <button class="w-full bg-blue-600 text-white py-4 rounded-2xl text-lg font-semibold hover:bg-blue-700 transition-shadow shadow-md hover:shadow-lg" type="submit">
       Sign Up
      </button>
     </form>
     <hr class="my-10 border-gray-300"/>
     <div class="text-center space-y-5 text-gray-700">
      <p class="text-base">
       Already have an account?
       <a class="text-blue-600 underline hover:text-blue-800 font-medium" href="login.html">
        Login
       </a>
      </p>
      <p class="text-base">
       Or sign up with:
      </p>
      <button class="inline-flex items-center justify-center border border-gray-300 rounded-2xl px-8 py-3 text-gray-700 hover:bg-gray-100 transition font-medium shadow-sm mx-auto" type="button">
       <img alt="Google logo placeholder, a stylized G in multicolor" class="mr-3" height="24" src="https://storage.googleapis.com/a1aa/image/c0caa583-10e4-4098-63b6-365e3525e280.jpg" width="24"/>
       Continue with Google
      </button>
     </div>
    </div>
   </div>
  </div>
 </body>
</html>
