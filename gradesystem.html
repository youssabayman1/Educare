<body class="font-sans text-[14px] text-blue-900">
<div class="max-w-[960px] mx-auto p-6 rounded-lg mt-8 shadow-lg select-none bg-white border border-blue-200">
  <h2 class="text-3xl font-extrabold mb-6 tracking-wide text-blue-500">Classroom Grading </h2>

  <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:space-x-4 space-y-3 sm:space-y-0">
    <input id="filterInput" type="text" placeholder="Filter by Name or ID" class="border border-blue-300 rounded-lg px-4 py-2 w-full max-w-sm text-[14px] transition focus:ring-4 focus:ring-blue-300" />
    <button id="clearFilterBtn" class="bg-blue-200 text-blue-800 px-4 py-2 rounded-lg hover:bg-blue-300 transition shadow-sm font-semibold">Clear</button>
  </div>

  <div class="overflow-x-auto rounded-lg border border-blue-300 shadow-sm table-container">
    <table class="w-full border-collapse text-[13px]" id="gradingTable">
      <thead>
        <tr id="headerRow" class="font-semibold">
          <th class="border-r border-blue-300 px-5 py-4 min-w-[160px] text-left">Name / ID</th>
          <!-- Dynamic assignment headers inserted here -->
          <th class="border-r border-blue-300 px-5 py-4 min-w-[140px] text-center">Total Score</th>
        </tr>
      </thead>
      <tbody id="gradingBody" class="bg-white">
        <!-- Student rows inserted here -->
      </tbody>
    </table>
  </div>

  <div class="mt-6 flex flex-wrap gap-3 justify-start">
    <button id="exportBtn" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 transition shadow-md flex items-center space-x-3 font-semibold">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>Export Results</span>
    </button>
  </div>
</div>

<script>
  // Simulated classroom API for assignments and students
  let classroomAssignments = [
    { id: 1, name: "Database schema", maxScore: 100 },
    { id: 2, name: "Software", maxScore: 5 }
  ];

  let classroomStudents = [
    { id: 101, name: "Abeer omran" },
    { id: 102, name: "Mariam omran" },
    { id: 103, name: "Sarah othman" }
  ];

  let assignments = [];
  let students = [];

  function createEl(tag, classes = "", text = "") {
    const el = document.createElement(tag);
    if (classes) el.className = classes;
    if (text) el.textContent = text;
    return el;
  }

  function initializeData() {
    assignments = classroomAssignments.map(a => ({ ...a }));
    students = classroomStudents.map(s => {
      const grades = {};
      assignments.forEach(a => grades[a.id] = null);
      return { ...s, grades };
    });
  }

  function renderHeader() {
    const headerRow = document.getElementById("headerRow");
    while (headerRow.children.length > 2) {
      headerRow.removeChild(headerRow.children[1]);
    }
    assignments.forEach(a => {
      const th = createEl("th", "border-r border-blue-300 px-5 py-4 min-w-[140px] text-center cursor-pointer select-none");
      th.textContent = `${a.name} (out of ${a.maxScore})`;
      headerRow.insertBefore(th, headerRow.lastElementChild);
    });
  }

  function calculateTotal(student) {
    return assignments.reduce((sum, a) => {
      const val = student.grades[a.id];
      return sum + (typeof val === "number" ? val : 0);
    }, 0);
  }

  function renderStudents(filter = "") {
    const tbody = document.getElementById("gradingBody");
    tbody.innerHTML = "";

    const filteredStudents = students.filter(s => {
      const search = filter.trim().toLowerCase();
      if (!search) return true;
      return s.name.toLowerCase().includes(search) || s.id.toString().includes(search);
    });

    filteredStudents.forEach(student => {
      const tr = createEl("tr", "border-b border-blue-200 hover:bg-blue-100 transition");

      const tdName = createEl("td", "border-r border-blue-300 px-5 py-4 font-semibold select-text min-w-[160px]");
      tdName.innerHTML = `<div class="text-blue-900 font-semibold">${student.name}</div><div class="text-xs text-blue-600 select-text">ID: ${student.id}</div>`;
      tr.appendChild(tdName);

      assignments.forEach(a => {
        const td = createEl("td", "border-r border-blue-300 px-5 py-4 text-center");
        const val = student.grades[a.id];
        const input = document.createElement("input");
        input.type = "number";
        input.min = 0;
        input.max = a.maxScore;
        input.step = "any";
        input.value = val !== undefined ? val : "";
        input.className = "w-full max-w-[80px] mx-auto text-center border border-blue-300 rounded-md px-3 py-2 text-[14px] transition focus:ring-4 focus:ring-blue-300 focus:border-blue-500";
        input.dataset.studentId = student.id;
        input.dataset.assignmentId = a.id;
        input.addEventListener("input", onGradeChange);
        td.appendChild(input);
        tr.appendChild(td);
      });

      const tdTotal = createEl("td", "px-5 py-4 min-w-[140px] font-bold text-center text-blue-700");
      tdTotal.textContent = calculateTotal(student).toFixed(2);
      tdTotal.dataset.studentId = student.id;
      tdTotal.classList.add("total-score-cell");
      tr.appendChild(tdTotal);

      tbody.appendChild(tr);
    });
  }

  function onGradeChange(e) {
    const input = e.target;
    const studentId = Number(input.dataset.studentId);
    const assignmentId = Number(input.dataset.assignmentId);
    let val = input.value;
    const max = Number(input.max);

    if (val === "") {
      val = null;
    } else {
      val = Number(val);
      if (isNaN(val) || val < 0) val = 0;
      if (val > max) val = max;
      input.value = val;
    }

    const student = students.find(s => s.id === studentId);
    if (!student.grades) student.grades = {};
    student.grades[assignmentId] = val;

    updateTotalScore(studentId);
  }

  function updateTotalScore(studentId) {
    const student = students.find(s => s.id === studentId);
    const total = calculateTotal(student);
    const tdTotal = document.querySelector(`td.total-score-cell[data-student-id="${studentId}"]`);
    if (tdTotal) tdTotal.textContent = total.toFixed(2);
  }

  function exportResultsExcel() {
    const filter = document.getElementById("filterInput").value.trim().toLowerCase();
    const filteredStudents = students.filter(s => {
      if (!filter) return true;
      return s.name.toLowerCase().includes(filter) || s.id.toString().includes(filter);
    });

    const data = [
      ["ID", "Name", ...assignments.map(a => `${a.name} (Max ${a.maxScore})`), "Total Score"]
    ];

    filteredStudents.forEach(s => {
      const row = [
        s.id,
        s.name,
        ...assignments.map(a => s.grades[a.id] !== null && s.grades[a.id] !== undefined ? s.grades[a.id] : ""),
        calculateTotal(s).toFixed(2)
      ];
      data.push(row);
    });

    const ws = XLSX.utils.aoa_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Results");
    XLSX.writeFile(wb, "student_results.xlsx");
  }

  document.getElementById("filterInput").addEventListener("input", (e) => {
    renderStudents(e.target.value);
  });

  document.getElementById("clearFilterBtn").addEventListener("click", () => {
    document.getElementById("filterInput").value = "";
    renderStudents();
  });

  document.getElementById("exportBtn").addEventListener("click", exportResultsExcel);

  // Simulate dynamic classroom updates
  function simulateClassroomUpdates() {
    // Add new assignment after 5 seconds
    setTimeout(() => {
      classroomAssignments.push({ id: 3, name: "Final lab", maxScore: 50 });
      assignments = classroomAssignments.map(a => ({ ...a }));
      students.forEach(s => {
        if (!s.grades) s.grades = {};
        s.grades[3] = null;
      });
      renderHeader();
      renderStudents(document.getElementById("filterInput").value);
    }, 5000);

    // Add new student after 8 seconds
    setTimeout(() => {
      const newStudent = { id: 104, name: "New Student" };
      classroomStudents.push(newStudent);
      const grades = {};
      assignments.forEach(a => grades[a.id] = null);
      students.push({ ...newStudent, grades });
      renderStudents(document.getElementById("filterInput").value);
    }, 8000);
  }

  // Initialize data and render
  initializeData();
  renderHeader();
  renderStudents();
  simulateClassroomUpdates();
</script>
