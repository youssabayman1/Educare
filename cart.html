<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Online Courses Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <img alt="Chatbot logo with letters CB in blue and white background" class="w- h-12 rounded-lg shadow-md" height="48" src="../assets/Images/ChatGPT Image Apr 12, 2025, 07_43_14 PM.png" width="48"/>
      <a href="./store.html" class="text-2xl font-bold text-indigo-500">CourseHub</a>
      <nav class="space-x-6 text-gray-700 text-sm font-medium hidden md:flex">
        <a href="./index.html" class="hover:text-indigo-600">Home</a>
        <a href="./store.html" class="hover:text-indigo-600">Courses</a>
        <a href="cart.html" class="hover:text-indigo-600 flex items-center">
          <i class="fas fa-shopping-cart mr-1"></i> Cart
        </a>
      </nav>
      <button
        id="mobile-menu-button"
        class="md:hidden text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-600"
        aria-label="Open menu"
      >
        <i class="fas fa-bars fa-lg"></i>
      </button>
    </div>
    <nav
      id="mobile-menu"
      class="hidden md:hidden bg-white border-t border-gray-200"
      aria-label="Mobile menu"
    >
      <a href="./index.html" class="block px-4 py-3 text-gray-700 hover:bg-indigo-50">Home</a>
      <a href="./store.html" class="block px-4 py-3 text-gray-700 hover:bg-indigo-50">Courses</a>
      <a href="./cart.html" class="block px-4 py-3 text-gray-700 hover:bg-indigo-50 flex items-center">
        <i class="fas fa-shopping-cart mr-2"></i> Cart
      </a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-grow container mx-auto px-4 py-8">
    <h1 class="text-3xl font-semibold text-gray-900 mb-8">Your Cart</h1>

    <div class="flex flex-col md:flex-row md:space-x-8">
      <!-- Cart Items -->
      <section class="flex-grow bg-white rounded-lg shadow p-6 mb-8 md:mb-0">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Courses in Cart</h2>

        <ul id="cart-items" class="divide-y divide-gray-200">
          <!-- Cart items will be dynamically inserted here -->
        </ul>

        <p id="empty-cart-message" class="text-center text-gray-500 mt-12">
          Your cart is empty.
        </p>
      </section>

      <!-- Order Summary -->
      <aside class="w-full md:w-96 bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Order Summary</h2>
        <div class="flex justify-between text-gray-700 mb-4">
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="flex justify-between text-gray-700 mb-4">
          <span>Tax (10%)</span>
          <span id="tax">$0.00</span>
        </div>
        <div class="flex justify-between font-semibold text-gray-900 text-lg border-t border-gray-300 pt-4 mb-6">
          <span>Total</span>
          <span id="total">$0.00</span>
        </div>
        <button
          id="checkout-button"
          disabled
          class="w-full bg-indigo-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition"
        >
          Proceed to Checkout
        </button>
      </aside>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-6 mt-12">
    <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
      &copy; 2024 CourseHub. All rights reserved.
    </div>
  </footer>

  <script>
    // Sample courses data to simulate cart items
    const coursesInCart = [
      {
        id: 1,
        title: "Mastering JavaScript: From Beginner to Expert",
        instructor: "Jane Doe",
        price: 49.99,
        image:
          "https://placehold.co/100x70/png?text=JavaScript+Course&font=roboto&font-size=12",
        alt: "Cover image of a JavaScript course with code snippets and a laptop",
      },
      {
        id: 2,
        title: "Advanced CSS Techniques for Modern Web Design",
        instructor: "John Smith",
        price: 39.99,
        image:
          "https://placehold.co/100x70/png?text=CSS+Course&font=roboto&font-size=12",
        alt: "Cover image of a CSS course showing colorful web page layouts",
      },
      {
        id: 3,
        title: "React.js Essentials: Build Dynamic User Interfaces",
        instructor: "Emily Johnson",
        price: 59.99,
        image:
          "https://placehold.co/100x70/png?text=React+Course&font=roboto&font-size=12",
        alt: "Cover image of a React course with React logo and UI components",
      },
      {
        id: 4,
        title: "Python for Data Science and Machine Learning",
        instructor: "Michael Lee",
        price: 69.99,
        image:
          "https://placehold.co/100x70/png?text=Python+Course&font=roboto&font-size=12",
        alt: "Cover image of a Python course with data charts and code",
      },
      {
        id: 5,
        title: "Full-Stack Web Development Bootcamp",
        instructor: "Sarah Williams",
        price: 89.99,
        image:
          "https://placehold.co/100x70/png?text=Full-Stack+Course&font=roboto&font-size=12",
        alt: "Cover image of a full-stack development course with laptop and code",
      }
    ];

    const cartItemsContainer = document.getElementById("cart-items");
    const emptyCartMessage = document.getElementById("empty-cart-message");
    const subtotalEl = document.getElementById("subtotal");
    const taxEl = document.getElementById("tax");
    const totalEl = document.getElementById("total");
    const checkoutButton = document.getElementById("checkout-button");

    // Function to format price as USD
    function formatPrice(price) {
      return `$${price.toFixed(2)}`;
    }

    // Render cart items
    function renderCartItems() {
      cartItemsContainer.innerHTML = "";
      if (coursesInCart.length === 0) {
        emptyCartMessage.classList.remove("hidden");
        checkoutButton.disabled = true;
        updateSummary();
        return;
      }
      emptyCartMessage.classList.add("hidden");
      checkoutButton.disabled = false;

      coursesInCart.forEach((course) => {
        const li = document.createElement("li");
        li.className = "py-6 flex flex-col sm:flex-row sm:items-center sm:space-x-6";

        li.innerHTML = `
          <img
            src="${course.image}"
            alt="${course.alt}"
            class="w-24 h-16 object-cover rounded-md flex-shrink-0 mb-4 sm:mb-0"
            width="96"
            height="64"
          />
          <div class="flex-grow">
            <h3 class="text-lg font-semibold text-gray-900">${course.title}</h3>
            <p class="text-gray-600 text-sm mb-1">Instructor: ${course.instructor}</p>
            <p class="text-indigo-600 font-semibold text-base">${formatPrice(course.price)}</p>
          </div>
          <button
            aria-label="Remove ${course.title} from cart"
            class="text-red-600 hover:text-red-800 mt-3 sm:mt-0 sm:ml-auto flex items-center space-x-1"
            data-id="${course.id}"
          >
            <i class="fas fa-trash-alt"></i>
            <span class="hidden sm:inline">Remove</span>
          </button>
        `;

        cartItemsContainer.appendChild(li);
      });
    }

    // Calculate and update order summary
    function updateSummary() {
      const subtotal = coursesInCart.reduce((acc, course) => acc + course.price, 0);
      const tax = subtotal * 0.1;
      const total = subtotal + tax;

      subtotalEl.textContent = formatPrice(subtotal);
      taxEl.textContent = formatPrice(tax);
      totalEl.textContent = formatPrice(total);
    }

    // Remove course from cart
    function removeCourse(id) {
      const index = coursesInCart.findIndex((course) => course.id === id);
      if (index !== -1) {
        coursesInCart.splice(index, 1);
        renderCartItems();
        updateSummary();
      }
    }

    // Event delegation for remove buttons
    cartItemsContainer.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (btn && btn.dataset.id) {
        const courseId = parseInt(btn.dataset.id, 10);
        removeCourse(courseId);
      }
    });

    // Checkout button click handler
    checkoutButton.addEventListener("click", () => {
      // For demonstration, navigate to a dummy checkout page
      window.location.href = "checkout.html";
    });

    // Mobile menu toggle
    const mobileMenuButton = document.getElementById("mobile-menu-button");
    const mobileMenu = document.getElementById("mobile-menu");
    mobileMenuButton.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });

    // Initial render
    renderCartItems();
    updateSummary();
  </script>
</body>
</html>
